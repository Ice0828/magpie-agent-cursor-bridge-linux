name: Build and Release Linux Native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native engine
        run: bash scripts/build-native.sh
        env:
          CARGO_BUILD_JOBS: 4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-magpie-bridge-linux-x64
          path: bin/cursor-magpie-bridge

  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native engine
        run: bash scripts/build-native.sh
        env:
          CARGO_BUILD_JOBS: 4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-magpie-bridge-linux-arm64
          path: bin/cursor-magpie-bridge

  release:
    name: Publish Release Assets
    needs: [build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: cursor-magpie-bridge-linux-x64
          path: artifacts/x64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: cursor-magpie-bridge-linux-arm64
          path: artifacts/arm64

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          cp artifacts/x64/cursor-magpie-bridge release-assets/cursor-magpie-bridge-linux-x64
          cp artifacts/arm64/cursor-magpie-bridge release-assets/cursor-magpie-bridge-linux-arm64
          chmod +x release-assets/*
          cd release-assets && sha256sum cursor-magpie-bridge-linux-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cursor-magpie-bridge-linux-x64
            release-assets/cursor-magpie-bridge-linux-arm64
            release-assets/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
